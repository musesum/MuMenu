    return Math.abs(a / 2);
  }

  function strokeInside(pt, poly) {
    var inside = false;
    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if ((yi > pt[1]) !== (yj > pt[1]) &&
          pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) { inside = !inside; }
    }

  function segCross(a, b, c, d) {
    function ccw(p, q, r) {
      return (r[1] - p[1]) * (q[0] - p[0]) > (q[1] - p[1]) * (r[0] - p[0]);
    }
    return ccw(a, c, d) !== ccw(b, c, d) && ccw(a, b, c) !== ccw(a, b, d);
  }

  // self-intersections over non-adjacent segments of the resampled path
  function strokeCrossings(p) {
    var n = 0;
    for (var i = 1; i < p.length; i++) {
      for (var j = i + 2; j < p.length; j++) {
        if (i === 1 && j === p.length - 1) { continue; }
        if (segCross(p[i - 1], p[i], p[j - 1], p[j])) { n++; }
      }

    return n;
  }

  // direction reversals along the dominant axis — the zigzag half of a strike.
  // The deadband rides the sample step, so a short stroke can still reverse.
  function strokeReversals(p, step) {
    var dx = 0, dy = 0, i;
    for (i = 1; i < p.length; i++) {

      dy += Math.abs(p[i][1] - p[i - 1][1]);

    var ax = dx >= dy ? 0 : 1, last = 0, n = 0;

  // a segment meets an axis-aligned rect: either endpoint inside, or a
  // crossing with any of its four edges
  function segRect(a, b, r) {
    function inR(q) {

    if (inR(a) || inR(b)) { return true; }
    return segCross(a, b, [r.x0, r.y0], [r.x1, r.y0]) ||

           segCross(a, b, [r.x1, r.y1], [r.x0, r.y1]) ||

  // a closed loop around two or more bodies groups them; an open squiggle
  // through exactly one hand supernet dissolves it; ambiguity is a no-op.
  // The gates read SCREEN geometry — what the finger drew — and only the

  function strokeApply(sp) {

    var step = len / (p.length - 1);
    var gap = Math.sqrt(Math.pow(p[0][0] - p[p.length - 1][0], 2) +
                        Math.pow(p[0][1] - p[p.length - 1][1], 2));

    for (var i = 0; i < p.length; i++) { gp.push(tr.invert(p[i])); }
    var isRoot = {};
    for (i = 0; i < realRootIds.length; i++) { isRoot[realRootIds[i]] = true; }
    if (gap < Math.max(40, len * 0.15) && strokeArea(p) > 1200) {
      var inside = [];
      for (i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        if (hidden[n.id] || n.x === undefined || isRoot[n.id]) { continue; }
        if (strokeInside([n.x, n.y], gp)) { inside.push(n); }
      }
      if (inside.length < 2) { return "none"; }
      // a loop over a standing hand group joins the extra bodies to it —
      // never a group of the group
      var handIn = null;
      for (i = 0; i < inside.length; i++) {
        if (inside[i].sup && inside[i].hand) { handIn = inside[i]; break; }
      }
      if (handIn) {
        var mg = findManual(handIn.id);
        if (mg) {
          var prev = { members: mg.members.slice(), lines: mg.lines.slice() };
          for (i = 0; i < inside.length; i++) {
            var ni = inside[i];
            if (ni.id === mg.id) { continue; }
            mg.lines.push(ni.name);
            if (ni.sup) { mg.members = mg.members.concat(ni.members); }
            else if (mg.members.indexOf(ni.id) < 0) { mg.members.push(ni.id); }
          }
          delete superObjs[mg.id];             // the box resizes to its new list
          txnPush({ type: "join", gid: mg.id,
                    prev: prev,
                    next: { members: mg.members.slice(), lines: mg.lines.slice() } });
          superManualWas = "\u0001";
          applySupers();
          solveFit();
          return "join";
        }
      }
      var members = [], lines = [];
      for (i = 0; i < inside.length; i++) {
        lines.push(inside[i].name);
        if (inside[i].sup) { members = members.concat(inside[i].members); }
        else { members.push(inside[i].id); }

      var spec = { id: -(1000000 + (++manualSeq)),

                   lines: lines, members: members };

      txnPush({ type: "create", spec: spec, at: manualSupers.length - 1 });

      solveFit();

    if (strokeCrossings(p) < 1 && strokeReversals(p, step) < 3) { return "none"; }

    for (i = 0; i < nodes.length; i++) {

    for (i = 0; i < manualSupers.length; i++) {
      if (manualSupers[i].id !== struck[0]) { continue; }
      var gone = manualSupers.splice(i, 1)[0];

    solveFit();
    return "strike";
  }

  function findManual(gid) {
    for (var i = 0; i < manualSupers.length; i++) {

    }

  // ── the transaction ledger ─────────────────────────────────────────────
  // Every user action lands once: the arrows replay them, and the log — shift
  // distance, angle, edge count, by node kind — is the training corpus the
  // host saves at rest. A replay never re-records.
  function nodeKindOf(d) {
    if (!d) { return "?"; }
    if (d.sup) { return d.hand ? "hand" : "super"; }
    return d.hub ? "hub" : "node";

  function txnPush(a) {

  // every action earns a save, trailing so a burst lands once

  }

  function txnFact(a) {

      f.node = nodeKindOf(d);
      f.dx = Math.round((a.to[0] - a.from[0]) * 10) / 10;
      f.dy = Math.round((a.to[1] - a.from[1]) * 10) / 10;
      f.dist = Math.round(Math.sqrt(f.dx * f.dx + f.dy * f.dy) * 10) / 10;

      f.gid = (a.gid !== undefined) ? a.gid : (a.spec ? a.spec.id : undefined);

    for (var i = 0; i < rows.length; i++) {

      if (!d) { continue; }

      d.y = back ? rows[i][2] : rows[i][4];

  function txnBack(a) {

    if (a.type === "create") { spliceManual(a.spec.id); }
    else if (a.type === "join") { restoreManual(a.gid, a.prev); }
    else if (a.type === "strike" || a.type === "split") {

    else if (a.type === "expand") { delete burned[a.opIx]; }

    solveFit();
  }

  function txnFore(a) {
    if (a.type === "drag") { dragSetTo(a, false); return; }
    if (a.type === "create") { manualSupers.splice(Math.min(a.at, manualSupers.length), 0, a.spec); }
    else if (a.type === "join") { restoreManual(a.gid, a.next); }
    else if (a.type === "strike" || a.type === "split") { spliceManual(a.spec.id); }
    else if (a.type === "expand") { burned[a.opIx] = true; }
    superManualWas = "\u0001";
    applySupers();
    solveFit();
  }

  function spliceManual(gid) {
    for (var i = 0; i < manualSupers.length; i++) {

    }

    mg.lines = state.lines.slice();

    finally { replaying = false; }

    return true;

  window.graphRedo = function () {

    if (!a) { return false; }

    finally { replaying = false; }
    saveSoon();
    return true;

  // the rest snapshot the host persists: positions plus the ledger. Memoed on

    if (!txnLog.length && !undoA.length) { return; }   // nothing user-made to save

    layoutSentAt = txnSeq; layoutSentN = realNodes.length;
    var out = [];
    for (var i = 0; i < realNodes.length; i++) {

      setBase(d);
      n++;
    }
    if (n && simulation) {
      reheatCancel();
      simulation.alpha(0); simulation.alphaTarget(0); simulation.stop();
      tick();
      fitField();         // the frame follows the recalled field, not the tidy one
    }
    return n;
  };

  // the cold door: the host calls this last, after its startup resends, so
  // whatever trailing reheat they re-armed is dropped and the run rests on
  // the layout — the tidy solve or the recalled one — exactly as placed
  window.settleCold = function () {
    if (!simulation) { return false; }
    reheatCancel();
    simulation.alpha(0); simulation.alphaTarget(0); simulation.stop();
    tick();
    return true;
  };

  // headless door — the ledger and the stacks, for the harness
  window.__flod3Txns = function () {

  };

  // headless door — the tap guard the background tap reads, and whether the

  // headless door: graph-space points through the same classify-and-apply

  window.__flod3Stroke = function (pts) {
    if (!pts || pts.length < 4) { return "none"; }
    var tr = d3.zoomTransform(svg.node());
    return strokeApply(pts.map(function (p) { return tr.apply([+p[0], +p[1]]); }));

  // ── degree of interest (setDepth) ──────────────────────────────────────
  // The horizon never hides on its own: membership grays a node under
  // "context" and drops it under "focus" (recomputePaths), while "all" is the
  // whole graph untouched. A fold still hides in every mode, and a widened
  // horizon still burns every fold it reaches — that burn is all depth does
  // outside the member ball.
  function recomputeHidden() {
    hidden = {};
    var dist = depthDist();                    // the walk, whatever the mode
    uncollapseByReach(dist);                   // a widened horizon outranks a fold
    hideByCollapse();
    folded = {};                               // before path pruning: what a tap can undo
    Object.keys(hidden).forEach(function (key) { folded[key] = true; });
    revealSelected();                          // a selected node is never off screen
    revealHover();                             // nor is one the cursor is asking about
  }

  // mark, pick, interconnect and menu sync outrank depth and collapse: the flags
  // stay stored, so clearing the channel hands the node back to its prior ruling
  function revealSelected() {
    var sets = [interSel, pickSel, markSel, menuSel];
    for (var i = 0; i < sets.length; i++) {
      var keys = Object.keys(sets[i]);

    if (!hoverRevealAny) { return; }

    for (var i = 0; i < keys.length; i++) { delete hidden[keys[i]]; }
  }

  // The horizon is anchored by the gestures that mean to move it — the host's
  // focusNodeId and the structural double tap — and not by a plain selection,
  // so a single tap can select without anything leaving the screen. Absent an
  // anchor it falls back to the selection, then to the roots.
  function depthSeeds() {
    if (seedId !== -1 && byId[seedId]) { return [seedId]; }
    if (focus) { return [focus.id]; }
    var sel = selectedIds();
    return sel.length ? sel : rootIds.slice();
  }

  // the distances the horizon is measured in, or null where there is no horizon
  // to measure: depth off and an empty graph both name nothing to walk from.
  // The walk is made in every mode, because a fold burns on reach alone.
  function depthDist() {
    if (!depthN || !nodes.length) { return null; }
    var seeds = depthSeeds();
    if (!seeds.length) { return null; }
    return bfs(seeds);
  }

  // the horizon in hops; a negative depth is unlimited, and a fold stamped there
  // was made at that same unlimited horizon
  function horizonOf(n) { return (n < 0) ? Infinity : n; }

  // a rising depth outranks a fold made below it: the frontier keeps walking.
  // Level 0 hands back no reach, and a falling depth leaves every fold standing.
  // At the infinite horizon every fold the seeds can still reach burns; one in a
  // component the seeds never enter keeps its distance of undefined, and stands
  function uncollapseByReach(dist) {

    d.parentId = (spec.parentId === undefined) ? -1 : spec.parentId;
    if (superActive.indexOf(sid) < 0 || d.x === undefined) {
      var sx = 0, sy = 0, np = 0, ofs = {};
      for (var mi = 0; mi < spec.members.length; mi++) {
        var rd = realById[spec.members[mi]];
        if (rd && rd.x !== undefined) { sx += rd.x; sy += rd.y; np++; }
      }
      d.x = np ? sx / np : width / 2;
      d.y = np ? sy / np : height / 2;
      d.vx = 0; d.vy = 0; d.fx = null; d.fy = null;
      for (mi = 0; mi < spec.members.length; mi++) {
        var rd2 = realById[spec.members[mi]];
        if (rd2 && rd2.x !== undefined) { ofs[spec.members[mi]] = [rd2.x - d.x, rd2.y - d.y]; }
      }
      d.ofs = ofs;
    }
    return d;
  }

  // Re-derive the display arrays from the real ones: apply the first k slider
  // ops, then the hand-drawn groups (a hand group absorbs a carrier only
  // whole), remap and dedupe the links, re-bind the DOM, hand the forces the
  // new graph. State that named an absorbed node lets go; hand folds reset
  // with the cut.
  function applySupers() {
    if (dragging || !realNodes.length) { return; }
    if (!superOps) { superOps = clusterOps(); }
    var k = Math.max(0, Math.min(superOps.length, Math.round(superLevel * superOps.length)));
    var manualKey = manualSupers.map(function (m) { return m.id; }).join(",") +
                    "#" + Object.keys(burned).join(".");
    if (k === superK && manualKey === superManualWas) { return; }

    var wasActive = superActive.slice();
    var carrier = {}, kidsR = {}, i, mi;
    for (i = 0; i < realNodes.length; i++) { carrier[realNodes[i].id] = realNodes[i].id; }
    for (i = 0; i < realLinks.length; i++) {
      var rl = realLinks[i];
      if (rl.kind !== "red") { continue; }
      var pa = endId(rl.source), ch = endId(rl.target);
      if (pa === ch) { continue; }             // buildTree drops self-loops; so here
      if (!realById[pa] || !realById[ch]) { continue; }
      if (!kidsR[pa]) { kidsR[pa] = []; }
      kidsR[pa].push(ch);
    }
    function subtreeR(p) {
      // seen-set: a red cycle in the payload must not hang the walk
      var out = [p], sq = [p], sqi = 0, seenT = {};
      seenT[p] = true;
      while (sqi < sq.length) {
        var cs = kidsR[sq[sqi++]] || [];
        for (var ci = 0; ci < cs.length; ci++) {
          if (seenT[cs[ci]]) { continue; }
          seenT[cs[ci]] = true;
          out.push(cs[ci]); sq.push(cs[ci]);
        }
      }
      return out;
    }
    var live = {};
    function absorb(sid, name, lines, members, hand, title, gkind, parentId) {
      // a swallowed super dies whole; any member of it NOT taken by the new
      // super is handed back to itself, never left carried by a dead id
      var inNew = {}, gone = {};
      for (var ai = 0; ai < members.length; ai++) { inNew[members[ai]] = true; }
      for (ai = 0; ai < members.length; ai++) {
        var c = carrier[members[ai]];
        if (c < 0 && live[c] && !gone[c]) {
          gone[c] = true;
          var om = live[c].members;
          for (var oi = 0; oi < om.length; oi++) {
            if (!inNew[om[oi]]) { carrier[om[oi]] = om[oi]; }
          }
          delete live[c];
        }
        carrier[members[ai]] = sid;
      }
      live[sid] = { name: name, lines: lines, members: members, hand: !!hand,
                    title: title, kind: gkind, parentId: parentId };
    }
    for (i = 0; i < k; i++) {
      if (burned[i]) { continue; }             // a double-tap expanded this op
      var op = superOps[i], sid = -(2 + i);
      if (op.type === "part") {
        // member subtrees may share a multi-parent node; it lands once.
        // op.skip names the standing groups this absorb must leave whole
        var reals = [], lines = [], seenR = {};
        for (mi = 0; mi < op.members.length; mi++) {
          var sub = subtreeR(op.members[mi]);
          for (var si = 0; si < sub.length; si++) {
            if (seenR[sub[si]]) { continue; }
            if (op.skip && op.skip[sub[si]]) { continue; }
            seenR[sub[si]] = true;
            reals.push(sub[si]);
          }
          lines.push(realById[op.members[mi]].name);
        }
        if (reals.length < 2) { continue; }    // skips can empty an absorb
        // grouped siblings wear the parent name; patterns wear their pattern
        var pTitle = (op.kind === "arcsig" && op.parent >= 0)
          ? realById[op.parent].name : op.name;
        absorb(sid, op.name, lines, reals, false, pTitle, op.kind, op.parent);
      } else {
        // every occurrence lands: wrapLines tallies duplicates into one
        // superscripted token. One absorbed carrier is still one body.
        var seenC2 = {}, lines2 = [];
        var pk = kidsR[op.parent] || [];
        for (mi = 0; mi < pk.length; mi++) {
          var cc = carrier[pk[mi]];
          if (cc < 0 && live[cc]) {
            if (seenC2[cc]) { continue; }
            seenC2[cc] = true;
            lines2.push(live[cc].name);
          } else {
            lines2.push(realById[pk[mi]].name);
          }
        }
        var body = subtreeR(op.parent);
        if (op.skip) {
          body = body.filter(function (bid) { return !op.skip[bid]; });
        }
        if (body.length < 2) { continue; }     // skips can empty an absorb
        absorb(sid, op.name, lines2, body, false,
               op.name, "fold", op.parent);
      }
    }
    for (i = 0; i < manualSupers.length; i++) {
      var mg = manualSupers[i], inSet = {}, seenC = {}, take = [], bodies = 0;
      for (mi = 0; mi < mg.members.length; mi++) { inSet[mg.members[mi]] = true; }
      for (mi = 0; mi < mg.members.length; mi++) {
        var cid = carrier[mg.members[mi]];
        if (seenC[cid]) { continue; }
        seenC[cid] = true;
        if (cid >= 0) { take.push(cid); bodies++; continue; }
        var lm = live[cid] ? live[cid].members : null;
        if (!lm) { continue; }
        var whole = true;
        for (var li = 0; li < lm.length; li++) { if (!inSet[lm[li]]) { whole = false; break; } }
        if (whole) { take = take.concat(lm); bodies++; }
      }
      if (bodies < 2) { continue; }
      absorb(mg.id, mg.name, mg.lines, take, true, "\u270E", "hand", -1);
    }

    var act = [];
    Object.keys(live).forEach(function (key) { act.push(+key); });
    act.sort(function (a, b) { return b - a; });

    // a dying super hands its members back around where it stands
    for (i = 0; i < wasActive.length; i++) {
      if (live[wasActive[i]]) { continue; }
      var od = superObjs[wasActive[i]];
      if (!od || !od.ofs || od.x === undefined) { continue; }
      for (mi = 0; mi < od.members.length; mi++) {
        var rd = realById[od.members[mi]], of = od.ofs[od.members[mi]];
        if (!rd || !of) { continue; }
        rd.x = od.x + of[0]; rd.y = od.y + of[1];
        rd.vx = 0; rd.vy = 0;
        if (rd.fx !== null && rd.fx !== undefined) { rd.fx = rd.x; rd.fy = rd.y; }
      }
    }

    var newNodes = [], dispById = {};
    for (i = 0; i < realNodes.length; i++) {
      var n = realNodes[i];
      if (carrier[n.id] !== n.id) { continue; }
      newNodes.push(n); dispById[n.id] = n;
    }
    for (i = 0; i < act.length; i++) {
      var sd = superDatum(act[i], live[act[i]]);
      newNodes.push(sd); dispById[sd.id] = sd;
    }

    var newLinks = [], edgeSeen = {};
    for (i = 0; i < realLinks.length; i++) {
      var l = realLinks[i];
      var a = carrier[endId(l.source)], b = carrier[endId(l.target)];
      if (a === b) { continue; }
      if (a >= 0 && b >= 0) { newLinks.push(l); continue; }
      var ek = a + "|" + b + "|" + l.kind;
      if (edgeSeen[ek]) { continue; }
      edgeSeen[ek] = true;
      newLinks.push({ source: dispById[a], target: dispById[b],
                      kind: l.kind, ix: synIxFor(ek), sup: true });
    }

    nodes = newNodes; links = newLinks; byId = dispById;
    buildTree(links);
    buildRoots(links);

    // absorbed reals resolve to their carrier for every id-keyed channel
    superOf = {};
    Object.keys(carrier).forEach(function (key) {
      var id = +key;
      if (carrier[id] !== id) { superOf[id] = carrier[id]; }
    });

    // state that named an absorbed node lets go
    if (focus && !byId[focus.id]) { focus = null; }
    if (seedId !== -1 && !byId[seedId]) { seedId = -1; }
    Object.keys(pinIds).forEach(function (key) {
      if (byId[+key]) { return; }
      var pd = realById[+key];
      if (pd) { pd.fx = null; pd.fy = null; }  // an orphan door pin is unreachable
      delete pinIds[key];
    });
    pinDoorAny = Object.keys(pinIds).length > 0;
    Object.keys(hidden).forEach(function (key) { if (!byId[+key]) { delete hidden[key]; } });
    collapsed = {}; collapsedAt = {};
    thawFar();                                 // release the far field, never orphan its fx
    if (hoverId >= 0 && !byId[hoverId]) { hoverClear(); }
    ctxForget();
    focusKeep = null;
    superK = k; superManualWas = manualKey; superActive = act;

    bindGraph();
    reheatWide = true;                    // the cut changes the solved graph itself
    hiddenWas = "?";                      // the swap always earns its rebuild
    refresh(true);                        // the caller owns the solve: resolveFresh or the load tail
  }

  // ── connected components ───────────────────────────────────────────────
  // Color filters and folds fragment the graph. Each piece is drifted bodily
  // toward the centroid of everything visible, so the fragments end up on one
  // screen while charge and collide keep them apart.
  function recomputeComponents() {
    compOf = {}; compList = [];
    var vis = nodes.filter(function (d) { return !hidden[d.id]; });
    if (!vis.length) { return; }

    var nbr = {};
    vis.forEach(function (d) { nbr[d.id] = []; });
    links.forEach(function (l) {
      if (!linkOn(l)) { return; }
      var a = endId(l.source), b = endId(l.target);
      if (a === b || !nbr[a] || !nbr[b]) { return; }
      nbr[a].push(b);
      nbr[b].push(a);
    });

    for (var i = 0; i < vis.length; i++) {
      var seed = vis[i].id;
      if (compOf[seed] !== undefined) { continue; }
      var ci = compList.length, ids = [seed], queue = [seed], qi = 0;
      compOf[seed] = ci;
      while (qi < queue.length) {
        var nb = nbr[queue[qi++]];
        for (var k = 0; k < nb.length; k++) {
          if (compOf[nb[k]] !== undefined) { continue; }
          compOf[nb[k]] = ci;
          ids.push(nb[k]);
          queue.push(nb[k]);
        }
      }
      compList.push({ idx: ci, ids: ids, cx: width / 2, cy: height / 2 });
    }
    refreshComponents();
  }

  // per-component centroids plus the global one they are pulled toward
  function refreshComponents() {
    var sx = 0, sy = 0, n = 0;
    for (var i = 0; i < compList.length; i++) {
      var c = compList[i], px = 0, py = 0, m = 0;
      for (var k = 0; k < c.ids.length; k++) {
        var d = byId[c.ids[k]];
        if (!d || d.x === undefined) { continue; }
        px += d.x; py += d.y; m++;
      }
      c.cx = m ? px / m : width / 2;
      c.cy = m ? py / m : height / 2;
      sx += px; sy += py; n += m;
    }
    compCx = n ? sx / n : width / 2;
    compCy = n ? sy / n : height / 2;
  }

  // One component = one rigid offset, so the pull gathers without compressing,
  // and only the distance past the co-presence radius is pulled in — a piece
  // already on screen is left where the layout put it.
  function componentForce(alpha) {
    if (compList.length < 2) { return; }
    refreshComponents();
    var reach = COMP_GATHER * Math.min(width, height);
    for (var i = 0; i < compList.length; i++) {
      var c = compList[i];
      var ox = compCx - c.cx, oy = compCy - c.cy;
      var len = Math.sqrt(ox * ox + oy * oy);
      if (len <= reach) { continue; }
      var pull = ((len - reach) / len) * COMP_PULL * alpha;
      var dx = ox * pull, dy = oy * pull;
      for (var k = 0; k < c.ids.length; k++) {
        var d = byId[c.ids[k]];
        if (!d || d.vx === undefined) { continue; }
        d.vx += dx; d.vy += dy;
      }
    }
  }

  // ── centroid correction ────────────────────────────────────────────────
  // forceCenter re-centers the shown set every tick, unscaled, so any change to
  // that set translates the graph bodily; it stays out. forceX / forceY pull
  // every node toward the middle one at a time, which is gravity — it squeezes
  // the layout, and being alpha-scaled it gives up while the centroid is still
  // 51px off. This reads the centroid of the shown nodes and hands every
  // unfrozen one the same small velocity toward the middle of the stage: equal
  // for all, so it is a translation and no distance between two nodes changes,
  // and a velocity rather than a position, so friction eases it in and the
  // graph drifts rather than jumps. The error shrinks geometrically, so the
  // pull fades as it arrives. Frozen and pinned nodes keep their ground — fx
  // holds them regardless, and leaving them out keeps the pull off the layout
  // the local reheat is protecting.
  function centerForce() {
    if (!TUNE.centerPull) { return; }
    var sx = 0, sy = 0, n = 0, i, d;
    for (i = 0; i < nodes.length; i++) {
      d = nodes[i];
      if (hidden[d.id] || d.x === undefined) { continue; }
      sx += d.x; sy += d.y; n++;
    }
    if (!n) { return; }
    var dx = (width / 2 - sx / n) * TUNE.centerPull;
    var dy = (height / 2 - sy / n) * TUNE.centerPull;
    for (i = 0; i < nodes.length; i++) {
      d = nodes[i];
      if (hidden[d.id] || d.vx === undefined) { continue; }
      if (frozenIds[d.id]) { continue; }                       // held by the local reheat
      if (d.fx !== null && d.fx !== undefined) { continue; }   // a pin or a drag owns it
      d.vx += dx; d.vy += dy;
    }
  }

  // ── reheat ─────────────────────────────────────────────────────────────
  // Rebuild the simulation over the visible subgraph only, so hidden nodes stop
  // pushing; datum objects carry their positions across, then alpha is restored.
  var entered = 0;                             // nodes seeded on the last rebuild
  var frozen = 0;                              // nodes the last rebuild held still
  var rebuilds = 0;                            // rebuilds that changed the solved graph
  var noops = 0;                               // rebuilds the guard answered with paint

  // the set this rebuild would be made over: the visible nodes and the visible
  // links, by wire position, so two rebuilds over the same graph compare equal
  function rebuildSig(vis, visLinks) {
    var s = "", i;
    for (i = 0; i < vis.length; i++) { s += vis[i].id + ","; }
    s += "|";
    for (i = 0; i < visLinks.length; i++) { s += visLinks[i].ix + ","; }
    return s;
  }

  // `quiet` swaps the force arrays and nothing else: no seeding, no freeze and
  // no energy. A flip owns its own geometry and wants the arrays right first.
  function reheatNow(quiet) {
    if (!simulation) { return; }
    var first = !visWas;
    var vis = nodes.filter(function (d) { return !hidden[d.id]; });
    var visLinks = links.filter(function (l) {
      return linkOn(l) && !hidden[endId(l.source)] && !hidden[endId(l.target)];
    });

    // The no-op rebuild guard. A highlight — a tap, a mark, a search, a hover,
    // a radio flip that hides nothing — leaves the graph the forces are solving
    // byte for byte identical, and reassigning the nodes and swapping the link
    // force over that same graph while handing back alpha is what used to move
    // all 573 of them. Same set, same links, no force constant touched: repaint
    // and leave the run exactly as cold as it was found.
    var sig = rebuildSig(vis, visLinks);
    if (!first && !reheatWide && sig === lastSig) { noops++; paint(); return; }
    lastSig = sig;
    rebuilds++;

    var fresh = quiet ? [] : seedEntering(vis);
    entered = fresh.length;

    // the change this rebuild answers for: what arrived, what left from beside
    // a survivor, and whatever the host or a tap is holding
    var seeds = fresh.slice();
    if (visWas) {
      Object.keys(visWas).forEach(function (key) {
        var id = +key;
        if (!hidden[id]) { return; }             // still on screen
        var nb = adj[id] || [];
        for (var k = 0; k < nb.length; k++) { if (!hidden[nb[k]]) { seeds.push(nb[k]); } }
      });
    }
    if (focus && !hidden[focus.id]) { seeds.push(focus.id); }

    var now = {};
    vis.forEach(function (d) { now[d.id] = true; });
    visWas = now;

    frozen = quiet ? 0 : freezeFar(vis, seeds, first);

    simulation.nodes(vis);
    simulation.force("link", makeLink(visLinks));

    guardLast();
    reheatWide = false;
    if (!quiet) { reheatAlpha(); }
  }

  // ── local reheat ───────────────────────────────────────────────────────
  // A 573-node layout does not reach a fixed point inside any alpha budget a
  // gesture can afford, so every restart carries on solving the whole graph and
  // the nodes the reader was looking at slide away under them. What actually
  // changed is a handful of nodes, so the rebuild is scoped to them: everything
  // more than TUNE.reheatHops away is pinned where it stands for the length of
  // the reheat and let go when it cools. Only ids this owns are released, so a
  // tap pin, a drag and a host pin are never disturbed.
  // A rebuild that changes the forces themselves — a tune knob, or any
  // solveFit — sets reheatWide and freezes nothing, because there the whole
  // layout is the answer being asked for.
  function freezeFar(vis, seeds, first) {
    thawFar();
    if (reheatWide || sliderOn || first) { return 0; }

    var near = {}, queue = [], i = 0;
    for (i = 0; i < seeds.length; i++) {
      var s = seeds[i];
      if (near[s] === undefined && byId[s] && !hidden[s]) { near[s] = 0; queue.push(s); }
    }
    i = 0;
    while (i < queue.length) {
      var cur = queue[i++];
      if (near[cur] >= TUNE.reheatHops) { continue; }
      var nb = adj[cur] || [];
      for (var k = 0; k < nb.length; k++) {
        if (near[nb[k]] !== undefined || hidden[nb[k]]) { continue; }
        near[nb[k]] = near[cur] + 1;
        queue.push(nb[k]);
      }
    }

    var n = 0;
    for (i = 0; i < vis.length; i++) {
      var d = vis[i];
      if (near[d.id] !== undefined) { continue; }
      if (d.fx !== null && d.fx !== undefined) { continue; }   // a pin or a drag owns it
      d.fx = d.x; d.fy = d.y; d.vx = 0; d.vy = 0;
      frozenIds[d.id] = true; frozenAny = true; n++;
    }
    return n;
  }

  function thawFar() {
    if (!frozenAny) { return; }
    var keys = Object.keys(frozenIds);
    for (var i = 0; i < keys.length; i++) {
      var d = byId[+keys[i]];
      if (d) { d.fx = null; d.fy = null; }
    }
    frozenIds = {};
    frozenAny = false;
  }

  // The far field is handed back when the run is cold, not when the target
  // drops: alpha keeps falling for a second or so past that, and a graph let go
  // mid-decay slides exactly as far as it did before the freeze existed.
  function thawWhenCold() {
    if (!simulation || simulation.alpha() >= THAW_ALPHA) { return; }
    if (frozenAny) { thawFar(); }
    // the structural pin goes with the far field: at rest, releasing fx moves
    // nothing, so the node is handed back for free and no impulse is owed
    if (recalcOn) { recalcOn = false; frictApply(); }   // the ramp ends where the run does
    // the saved layout is where the solve STOPS, not where it goes quiet: the
    // last 40 ticks under THAW_ALPHA still carry the graph ~24px, so the
    // capture waits for d3's own alphaMin
    if (baseWant && simulation.alpha() < ALPHA_MIN) { captureBase(); postLayout(); }
  }

  // Energy is handed back as a target the run climbs toward and then leaves,
  // never as a restart from full alpha: the nodes already on screen are the
  // answer to almost the same question, so the rebuild only has to nudge them.
  // Friction rides the same rebuild: the run eases up from wherever the knob
  // stands toward FRICTION_SETTLE over FRICTION_MS.recalc, and thawWhenCold
  // hands it back to TUNE.velocityDecay when the run is spent. It is only a
  // declared state on the one ramp, so a fling, a held finger and a slider hold
  // all still outrank it.
  function reheatAlpha() {
    if (!simulation) { return; }
    if (!recalcOn) { recalcOn = true; frictApply(); }
    simulation.alphaTarget(TUNE.reheatTarget).restart();
    if (coolTimer) { clearTimeout(coolTimer); }
    coolTimer = setTimeout(function () {
      coolTimer = null;
      if (simulation && !dragging) { simulation.alphaTarget(0); }
    }, TUNE.reheatHold);
  }

  // authoritative positions supersede any energy already booked: the armed
  // rebuild, the cooling hold and the target all go to nothing
  function reheatCancel() {
    if (reheatTimer) { clearTimeout(reheatTimer); reheatTimer = null; }
    reheatWide = false;                        // a dropped rebuild drops its scope too
    if (coolTimer) { clearTimeout(coolTimer); coolTimer = null; }
    if (simulation) { simulation.alphaTarget(0); }
  }

  // a rebuild that changes the forces themselves is global, not local

  // trailing throttle: a continuous knob stream collapses to one rebuild
  function reheatArm() {
    if (reheatTimer) { return; }
    reheatTimer = setTimeout(function () {
      reheatTimer = null;
      reheatNow(false);
    }, REHEAT_MS);
  }

  function reheat() { reheatArm(); }

  // ── friction ramp ──────────────────────────────────────────────────────
  // One model over one knob. velocityDecay is the share of a node's velocity
  // thrown away each tick, so a HIGHER value is stiller and a LOWER one freer.
  // Three sources declare a state and the highest ranking live one owns the
  // knob: a fast drag outranks a press-and-hold, which outranks a slider hold,
  // which outranks the resting value. Every change is a timed ramp, never a
  // step, so the graph never changes character under the hand.
  function frictWant() {
    if (flingOn) { return [flingOn, FRICTION_MS.drag]; }
    if (holdOn) { return [FRICTION_STILL, FRICTION_MS.hold]; }
    if (sliderOn) { return [FRICTION_FLOW, FRICTION_MS.slider]; }
    if (recalcOn) { return [FRICTION_SETTLE, FRICTION_MS.recalc]; }
    return [frictBase(), FRICTION_MS.release];
  }

  function frictApply() {
    var want = frictWant();
    if (want[0] === frictTo) { return; }
    frictFrom = frictNow;
    frictTo = want[0];
    frictMs = want[1];
    frictAt = Date.now();
    if (frictRaf) { cancelAnimationFrame(frictRaf); frictRaf = 0; }
    frictStep();
  }

  // easeInOut, so a ramp leaves slowly, crosses quickly and arrives slowly: the
  // the run keeps its freedom while the answer is still being found, and stiffens
  // into rest rather than stopping on a corner. Every source shares the shape.
  function frictEase(t) {
    return (t < 0.5) ? (2 * t * t) : (1 - 2 * (1 - t) * (1 - t));
  }

  function frictStep() {
    frictRaf = 0;
    var t = (frictMs > 0) ? Math.min(1, (Date.now() - frictAt) / frictMs) : 1;
    frictNow = frictFrom + (frictTo - frictFrom) * frictEase(t);
    if (simulation) { simulation.velocityDecay(frictNow); }
    if (t < 1 && typeof requestAnimationFrame === "function") {
      frictRaf = requestAnimationFrame(frictStep);
    }
  }

  // Host bridge. "slider" marks a native control being held: friction follows
  // the hold, no energy is injected. "script" marks the keyboard walk over the
  // script column: bookkeeping only, read back by the probe. Any other kind

    // the hover dim alike
    if (hubLink[pairKey(d.source.id, d.target.id)]) { return "on"; }
    if (grayed[d.source.id] || grayed[d.target.id]) { return "dim"; }
    // the chain to the root is the hover, so a focus or a one-hop selection
    // sitting elsewhere cannot mute the lineage the cursor is standing on
    if (hoverId >= 0 && hoverLine[pairKey(d.source.id, d.target.id)]) { return "on"; }
    // a one-hop ball only: both ends lit but neither is the selection, so the
    // wire runs neighbor to neighbor, outside the incident set the ring stands
    // for. A wider ball lights every edge it closes over and sets no seed here.
    if (adjSeed >= 0 && d.source.id !== adjSeed && d.target.id !== adjSeed) { return "dim"; }
    if (hoverId >= 0 && !(hoverOf[d.source.id] && hoverOf[d.target.id])) { return "dim"; }
    if (!focus) { return "on"; }
    return (d.source.id === focus.id || d.target.id === focus.id) ? "on" : "off";
  }

  function paint() {
    if (!linkSel) { return; }

    linkSel
      .style("display", function (d) {
        if (!linkOn(d)) {
          // the hovered lineage shows its red path even with red filtered off
          if (hoverId !== -1 && hoverLine[pairKey(d.source.id, d.target.id)] &&
              !hidden[d.source.id] && !hidden[d.target.id]) { return null; }
          return "none";
        }
        return (hidden[d.source.id] || hidden[d.target.id]) ? "none" : null;
      })
      .attr("stroke", function (d) { return COLOR[d.kind][linkState(d)]; })
      .attr("marker-end", function (d) {
        return headEnd(d) ? "url(#arrow-" + d.kind + "-" + linkState(d) + ")" : null;
      })
      .attr("marker-start", function (d) {
        return headStart(d) ? "url(#arrowback-" + d.kind + "-" + linkState(d) + ")" : null;
      });

    nodeSel.style("display", function (d) { return hidden[d.id] ? "none" : null; });

    // The hit styles own the capsule fill where they have one; every other
    // node wears the thin material. Two stroke claims over an unchanged fill:
    // the reach ring of a selected hub in full-strength yellow, and the
    // depth-expansion ball in a fine one — never repainted as a selection.
    capSel
      .style("display", null)                  // every node wears its material
      .attr("fill", function (d) {
        var s = stateOf(d);
        if (hitStyle(s)) { return capFill(s); }
        return s === "gray" ? MAT_DIM : MAT_FILL;
      })
      .attr("stroke", function (d) {
        if (d.sup) {                           // persistent, dimmed with a gray
          return stateOf(d) === "gray" ? SUP_EDGE_DIM : SUP_EDGE;
        }
        var s = stateOf(d);
        if (hitStyle(s)) { return capEdge(s); }
        if (hubReach[d.id]) { return HUB_REACH; }
        return ballGlow[d.id] ? BALL_GLOW : null;
      })
      .attr("stroke-width", function (d) {
        if (d.sup) { return 0.75; }
        if (hitStyle(stateOf(d)) || hubReach[d.id]) { return null; }
        return ballGlow[d.id] ? 0.75 : null;
      });

    textSel.attr("fill", function (d) {
      var s = stateOf(d);
      if (s === "inter") { return INTER_TEXT; }
      if (s === "menu") { return MENU_TEXT; }
      if (s === "search") { return SEARCH_TEXT; }
      if (s === "gray") { return GRAY_TEXT; }
      return PLAIN_TEXT;
    });

    // the supernet chrome grays with its node: band plate, stroke, yellow title
    if (supheadSel) {
      supheadSel.attr("fill", function (d) {
        return stateOf(d) === "gray" ? MAT_DIM : MAT_FILL;
      });
      supheadSel.attr("stroke", function (d) {
        return stateOf(d) === "gray" ? SUP_EDGE_DIM : SUP_EDGE;
      });
      suptitleSel.attr("fill", function (d) {
        return stateOf(d) === "gray" ? GRAY_TEXT : SUP_HEAD;
      });
    }

    // icons arrive black: the light fills take them as they are, and the dark
    // ones — bare page, gray, interconnect — invert to white
    if (imgSel) {
      imgSel.attr("filter", function (d) {
        var s = stateOf(d);
        return (s === "search" || s === "menu") ? null : "url(#iconInvert)";
      })
      .attr("opacity", function (d) { return stateOf(d) === "gray" ? 0.3 : 1; });
    }

    hoverPaint();   // a visibility change under the cursor must not strand a halo
  }

  // ── tick ───────────────────────────────────────────────────────────────
  function tick() {
    thawWhenCold();
    linkSel
      .attr("x1", function (d) { return trimX(d, d.source, d.target); })
      .attr("y1", function (d) { return trimY(d, d.source, d.target); })
      .attr("x2", function (d) { return trimX(d, d.target, d.source); })
      .attr("y2", function (d) { return trimY(d, d.target, d.source); });

    nodeSel.attr("transform", function (d) { return "translate(" + d.x + "," + d.y + ")"; });
  }

  // pull the endpoint back to the capsule boundary of `at`, so the arrowhead
  // lands outside the label rather than under it
  function trimFactor(at, from) {
    var dx = at.x - from.x, dy = at.y - from.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (!len) { return 0; }
    var hw = at.capW / 2 + 2, hh = at.capH / 2 + 2;
    var tx = (Math.abs(dx) > 1e-6) ? hw / Math.abs(dx) : Infinity;
    var ty = (Math.abs(dy) > 1e-6) ? hh / Math.abs(dy) : Infinity;
    return Math.min(0.5, Math.min(tx, ty));
  }
  function trimX(d, at, from) { return at.x - (at.x - from.x) * trimFactor(at, from); }
  function trimY(d, at, from) { return at.y - (at.y - from.y) * trimFactor(at, from); }

  // ── drag ───────────────────────────────────────────────────────────────
  // The drag gesture owns the tap. d3-drag binds touchend.drag on the node
  // ahead of anything this page binds — nodeSel.call(d3.drag()) runs before
  // nodeSel.on("touchend") — and its handler calls stopImmediatePropagation
  // whenever a gesture exists for that touch, which is every single-finger
  // touch on a label. The page's own touchend tap therefore never ran, and a
  // touch tap survived only on the UA compatibility click, which the drag's
  // own touchmove preventDefault suppresses the moment a finger wanders. So
  // the tap is dispatched from the drag-end path instead, and the compatibility
  // click is eaten by the tapDone stamp rather than posting a second time.
  // A drag is a layout edit, not an excuse to re-solve: the hand moves the
  // one node it holds and everything else is not touched at all.
  function dragStart(d) {
    dragging = true;
    // d3-drag stops propagation on mousedown and touchstart alike, so the
    // page's own handlers never get to clear the pan latch — and one drag
    // would otherwise leave every later tap on a node dead. The gesture starts
    // here, so the latch is cleared here, and only slop sets it again.
    moved = false;
    delete frozenIds[d.id];                    // the drag owns fx from here, not the freeze
    tapSlop = false;
    dragMoved = false;
    tapFrom = [d3.event.x, d3.event.y];
    dragAt = Date.now(); dragX = d3.event.x; dragY = d3.event.y;
    flingOn = 0;
    if (holdTimer) { clearTimeout(holdTimer); }
    holdTimer = setTimeout(function () {
      holdTimer = null;
      holdOn = true;                            // motion dies under a held finger
      frictApply();
    }, HOLD_START_MS);
    // the hand moves one node; the rest of the field stays home
    dragSet = [{ d: d, x0: d.x, y0: d.y, hop: 0, w: 1 }];
    dragFrom = [d.x, d.y];
    // the ball is written by hand from here, so no force may have it
    for (var i = 0; i < dragSet.length; i++) {
      var m = dragSet[i];
      m.d.fx = m.d.x; m.d.fy = m.d.y; m.d.vx = 0; m.d.vy = 0;
    }
    // a drag landing on a run still in motion holds the far field the same way
    // a local reheat does, so the region outside the ball keeps its ground
    if (simulation.alpha() > THAW_ALPHA) {
      var wide = reheatWide;
      reheatWide = false;
      freezeFar(simulation.nodes(), Object.keys(dragSet.reduce(function (o, m) {
        o[m.d.id] = true; return o;
      }, {})).map(Number), false);
      reheatWide = wide;
    }
  }

  function dragMove(d) {
    var k = d3.zoomTransform(svg.node()).k || 1;
    var now = Date.now();
    if (tapFrom && !tapSlop) {
      var wander = Math.sqrt(Math.pow(d3.event.x - tapFrom[0], 2) +
                             Math.pow(d3.event.y - tapFrom[1], 2)) * k;
      if (wander > TAP_SLOP) { tapSlop = true; moved = true; }
    }
    // a flung node leaves friction behind it, so the graph does not slosh
    var dt = Math.max(1, now - dragAt);
    var sp = Math.sqrt(Math.pow(d3.event.x - dragX, 2) +
                       Math.pow(d3.event.y - dragY, 2)) * k / dt;
    dragAt = now; dragX = d3.event.x; dragY = d3.event.y;
    var f = Math.min(1, sp / FLING_SPEED);
    flingOn = (f > 0.05) ? (frictBase() + (FRICTION_STILL - frictBase()) * f) : 0;
    frictApply();

    // the whole ball is placed from the one offset, so the falloff is exact
    if (!dragSet || !dragSet.length || !dragFrom) { d.fx = d3.event.x; d.fy = d3.event.y; return; }
    var ox = d3.event.x - dragFrom[0], oy = d3.event.y - dragFrom[1];
    for (var i = 0; i < dragSet.length; i++) {
      var m = dragSet[i];
      m.d.x = m.d.fx = m.x0 + ox * m.w;
      m.d.y = m.d.fy = m.y0 + oy * m.w;
      m.d.vx = 0; m.d.vy = 0;
    }
    if (tapSlop) { dragMoved = true; }         // sub-slop jitter stays a tap
    voroLive();                                // the neighbourhood parts under the hand
    tick();                                    // no force is running this: paint it
  }

  function dragEnd(d) {
    dragging = false;
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    holdOn = false; flingOn = 0; frictApply();
    var placed = dragMoved;
    var ball = (placed && dragSet) ? dragSet.slice() : null;
    // the edit lands in the saved layout: what moved, and only what moved
    for (var i = 0; dragSet && i < dragSet.length; i++) {
      var m = dragSet[i];
      // a door pin is not this gesture's to hand back: the ball may cover one
      if (!pinIds[m.d.id]) { m.d.fx = null; m.d.fy = null; }
      if (placed) { setBase(m.d); }
    }
    dragSet = null; dragFrom = null; dragMoved = false;
    if (!pinIds[d.id]) { d.fx = null; d.fy = null; }   // pinDrop re-pins a placed one
    if (placed) { pinDrop(d); }                // the drop holds it where the hand left it
    if (placed) { voroSettle(); }              // the drop clears its own overlaps
    if (ball) {
      // the whole ball, at where the settle left it, is the transaction
      txnPush({ type: "drag", id: d.id,
                from: [ball[0].x0, ball[0].y0], to: [d.x, d.y],
                set: ball.map(function (m) {
                  return [m.d.id, m.x0, m.y0, m.d.x, m.d.y];
                }) });
    }
    tapEnd(d);
  }

  // sub-slop gesture on one node = a tap, whatever pointer made it
  function tapEnd(d) {
    var slop = tapSlop;
    tapSlop = false; tapFrom = null;
    if (slop || moved) { return; }
    if (pair || Date.now() - holdEnded < TAP_DEDUPE_MS) { return; }   // compare gesture
    var src = d3.event && d3.event.sourceEvent;
    tapDone = Date.now();
    if (src && String(src.type).indexOf("touch") === 0) { lastTouchTap = tapDone; }
    tapDispatch(d);
  }

  // ── resize ─────────────────────────────────────────────────────────────
  // A resize moves the frame, never the graph: the stage numbers follow the
  // viewport, the transform slides by half the delta so the view keeps its
  // centre, and every node stands exactly where it was. The forces read the
  // new width and height on whatever rebuild comes next.
  window.addEventListener("resize", function () {
    var dw = window.innerWidth - width;
    var dh = window.innerHeight - height;
    width = window.innerWidth;
    height = window.innerHeight;
    svg.attr("width", width).attr("height", height);
    if (!dw && !dh) { return; }
    if (visibleBox()) { fitField(); return; }  // the frame follows the field into the new viewport
    var t = d3.zoomTransform(svg.node());
    panning = true;
    svg.call(zoom.transform, d3.zoomIdentity
      .translate(t.x + dw / 2, t.y + dh / 2)
      .scale(t.k));
    panning = false;
  });

  // dev harness only: ?load=fixture.json[&level=0.4] boots the page standalone
  (function () {
    var m = /[?&]load=([^&]+)/.exec(location.search);
    if (!m) { return; }
    fetch(decodeURIComponent(m[1])).then(function (r) { return r.json(); }).then(function (g) {
      window.loadGraph(g);
      var lv = /[?&]level=([\d.]+)/.exec(location.search);
      if (lv) { window.setCommunity(true, parseFloat(lv[1])); }
    });
  })();
}());
</script>
</body>
</html>
